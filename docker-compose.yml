services:
  mysql:
    image: mysql/mysql-server:8.0.32
    container_name: logistics-hub-twin-rds
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_ROOT_HOST=%
      - MYSQL_DATABASE=logistics_hub
    command: [ '--character-set-server=utf8mb4', '--collation-server=utf8mb4_general_ci' ]
    ports:
      - 3306:3306
    restart: always