/*
 * 공유 모듈: 도메인(member, 이후 center·event), 공통 설정(yml).
 * server(API)와 batch(배치 작업)가 함께 쓴다. 실행 jar 가 아니므로 bootJar 를 끄고 일반 jar 만 만든다.
 *
 * 경계 규칙 (md/develop-principal.md §5)
 *   - 도메인(*.domain)은 JPA·Jackson 어노테이션 외 기술 타입을 import 하지 않는다
 *     (예외: Member 는 인증 주체라 spring-security-core 의 UserDetails 를 구현한다)
 *   - 외부 기술(Redis, RabbitMQ, Spring AI)의 타입은 각자의 어댑터 패키지 아래만. 그래서 그 의존성은 implementation
 */
apply plugin: 'java-library'

jar {
    enabled = true
}

bootJar {
    enabled = false
}

dependencies {
    // 도메인 엔티티·리포지토리, enum 직렬화 어노테이션. server·batch 가 그대로 쓰므로 api
    api 'org.springframework.boot:spring-boot-starter-data-jpa'
    api 'com.fasterxml.jackson.core:jackson-annotations'
    // Member 가 UserDetails 를 구현해 인증 주체로 쓰인다. 웹 시큐리티(필터 체인)는 server 에만 있다
    api 'org.springframework.security:spring-security-core'
}
