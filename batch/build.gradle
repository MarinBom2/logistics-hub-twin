bootJar {
    archiveFileName = 'batch.jar'
}

springBoot {
    mainClass = 'com.marinbom2.logisticshubtwin.BatchApplication'
}

// 로컬 실행은 local 프로필 — server/build.gradle 과 같다
bootRun {
    systemProperty 'spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local'
    classpath += files(rootProject.file('secrets'))
}

dependencies {
    // 도메인·설정은 common:core 에서 온다. server(API 앱)는 의존하지 않는다
    implementation project(':common:core')

    implementation 'org.springframework.boot:spring-boot-starter-batch'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'

    runtimeOnly 'com.mysql:mysql-connector-j'

    testImplementation 'org.springframework.batch:spring-batch-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-mysql'
}
