/*
 * 루트 빌드: 플러그인 버전과 Java 모듈 공통 설정만 둔다. 모듈별 의존성은 각 모듈 build.gradle 에.
 *
 * 모듈
 *   :server       API + 화면(jar 하나에 client dist 포함). Boot 실행 jar
 *   :batch        배치 (이력 정리·집계). Boot 실행 jar
 *   :common:core  도메인·공통 설정(yml). 라이브러리 jar (bootJar 끔)
 *   :client       Vite + React + React Three Fiber (Node 플러그인, Java 아님)
 *   :common       common/core 를 담는 폴더일 뿐. 빌드 대상 아님
 *
 * plc-sim, edge-collector 는 M1·M2 에서 같은 방식으로 추가한다 (md/logistics-hub-twin.md §4)
 */
plugins {
    id 'org.springframework.boot' version '4.1.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'com.marinbom2'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

ext {
    jjwtVersion = '0.13.0'
    springdocVersion = '3.2.0'
}

def javaModules = [':server', ':batch', ':common:core']

configure(javaModules.collect { project(it) }) {
    apply plugin: 'java'
    apply plugin: 'org.springframework.boot'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok'
        annotationProcessor 'org.projectlombok:lombok'
        testCompileOnly 'org.projectlombok:lombok'
        testAnnotationProcessor 'org.projectlombok:lombok'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}
